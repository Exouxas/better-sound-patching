[package]
name = "better-sound-patching"
version = "0.1.0"
edition = "2024"
description = "Node-based PipeWire patchbay and mixer"
license = "MIT"
repository = "https://github.com/Exouxas/better-sound-patching"
rust-version = "1.96"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eframe = "0.36"
egui = "0.36"
egui-snarl = "0.12"
env_logger = "0.11.11"
log = "0.4.35"
pipewire = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
zbus = "5.19"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
deep-filter-rt = "0.2.0"
ndarray = "0.17"
rtrb = "0.4.1"
rustfft = "6.4.1"
tract-onnx = "0.23.10"

# A copy of egui-snarl 0.12.0 with left-click selection (see vendor/egui-snarl/BSP-CHANGES.md).
[patch.crates-io]
egui-snarl = { path = "vendor/egui-snarl" }
