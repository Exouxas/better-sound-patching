<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Signal flow: programs play into and record from stable virtual devices; processing and switch nodes connect them to whichever hardware you selected">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#50c878"/>
    </marker>
    <marker id="arrow-off" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a525c"/>
    </marker>
    <style>
      .t { font-family: Inter, "Segoe UI", Ubuntu, Cantarell, "Noto Sans", Helvetica, Arial, sans-serif; }
      .col { fill: #8b949e; font-size: 12px; font-weight: 600; letter-spacing: 1.2px; }
      .box { fill: #1b1f26; stroke: #2c333d; }
      .virt { fill: #16261d; stroke: #2f6b45; }
      .name { fill: #e6edf3; font-size: 14px; font-weight: 600; }
      .sub { fill: #8b949e; font-size: 11.5px; }
      .w { fill: none; stroke: #50c878; stroke-width: 2.2; marker-end: url(#arrow); }
      .w.off { stroke: #4a525c; stroke-dasharray: 5 5; marker-end: url(#arrow-off); }
      .lane { fill: #c9d1d9; font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="470" rx="12" fill="#0d1117"/>
  <rect width="1200" height="470" rx="12" fill="url(#dots)"/>

  <g class="t">
    <!-- Column headings -->
    <text class="col" x="40" y="40">PROGRAMS</text>
    <text class="col" x="268" y="40">VIRTUAL DEVICES</text>
    <text class="col" x="510" y="40">PROCESSING</text>
    <text class="col" x="738" y="40">SWITCH</text>
    <text class="col" x="972" y="40">HARDWARE</text>

    <!-- Lane labels -->
    <text class="lane" x="40" y="70">What you hear</text>
    <text class="lane" x="40" y="300">What others hear (your mic)</text>
    <line x1="40" y1="276" x2="1160" y2="276" stroke="#21262d"/>

    <!-- ===== Playback lane ===== -->
    <!-- programs -->
    <rect class="box" x="40" y="88" width="170" height="54" rx="8"/>
    <text class="name" x="56" y="111">Games, browser…</text>
    <text class="sub" x="56" y="129">"Other apps" node</text>
    <rect class="box" x="40" y="168" width="170" height="54" rx="8"/>
    <text class="name" x="56" y="191">Discord</text>
    <text class="sub" x="56" y="209">its own App node</text>

    <!-- virtual devices -->
    <rect class="virt" x="268" y="88" width="180" height="54" rx="8"/>
    <text class="name" x="284" y="111">system-in</text>
    <text class="sub" x="284" y="129">the default output</text>
    <rect class="virt" x="268" y="168" width="180" height="54" rx="8"/>
    <text class="name" x="284" y="191">communication-in</text>
    <text class="sub" x="284" y="209">voice chat</text>

    <!-- processing -->
    <rect class="box" x="510" y="118" width="170" height="74" rx="8"/>
    <text class="name" x="526" y="142">EQ · Volume</text>
    <text class="sub" x="526" y="161">tuned to your headset,</text>
    <text class="sub" x="526" y="177">changes play live</text>

    <!-- switch -->
    <rect class="box" x="738" y="104" width="176" height="102" rx="8"/>
    <text class="name" x="754" y="128">Output switch</text>
    <text class="sub" x="754" y="152" style="fill:#50c878">● 1 Headset</text>
    <text class="sub" x="900" y="152" text-anchor="end" style="fill:#50c878">Ctrl+Alt+1</text>
    <text class="sub" x="754" y="172">○ 2 Speakers</text>
    <text class="sub" x="900" y="172" text-anchor="end">Ctrl+Alt+2</text>
    <text class="sub" x="754" y="192">○ 3 VR headset</text>
    <text class="sub" x="900" y="192" text-anchor="end">Ctrl+Alt+3</text>

    <!-- hardware -->
    <rect class="box" x="972" y="76" width="188" height="44" rx="8"/>
    <text class="name" x="988" y="103">Headset</text>
    <rect class="box" x="972" y="134" width="188" height="44" rx="8" stroke-dasharray="4 3"/>
    <text class="name" x="988" y="161" style="fill-opacity:0.5">Speakers</text>
    <rect class="box" x="972" y="192" width="188" height="44" rx="8" stroke-dasharray="4 3"/>
    <text class="name" x="988" y="219" style="fill-opacity:0.5">VR headset</text>

    <!-- wires -->
    <path class="w" d="M 210 115 L 264 115"/>
    <path class="w" d="M 210 195 L 264 195"/>
    <path class="w" d="M 448 115 C 480 115, 476 150, 506 150"/>
    <path class="w" d="M 448 195 C 480 195, 476 162, 506 162"/>
    <path class="w" d="M 680 155 L 734 155"/>
    <path class="w" d="M 914 148 C 944 148, 940 98, 968 98"/>
    <path class="w off" d="M 914 168 C 940 168, 944 156, 968 156"/>
    <path class="w off" d="M 914 188 C 944 188, 940 214, 968 214"/>

    <!-- ===== Microphone lane (flows right to left) ===== -->
    <!-- hardware mics -->
    <rect class="box" x="972" y="318" width="188" height="44" rx="8"/>
    <text class="name" x="988" y="345">Headset mic</text>
    <rect class="box" x="972" y="376" width="188" height="44" rx="8" stroke-dasharray="4 3"/>
    <text class="name" x="988" y="403" style="fill-opacity:0.5">VR headset mic</text>

    <!-- switch -->
    <rect class="box" x="738" y="330" width="176" height="80" rx="8"/>
    <text class="name" x="754" y="354">Input switch</text>
    <text class="sub" x="754" y="378" style="fill:#50c878">● 1 Headset</text>
    <text class="sub" x="900" y="378" text-anchor="end" style="fill:#50c878">Ctrl+Alt+1</text>
    <text class="sub" x="754" y="398">○ 2 VR headset</text>
    <text class="sub" x="900" y="398" text-anchor="end">Ctrl+Alt+3</text>

    <!-- processing -->
    <rect class="box" x="510" y="334" width="170" height="74" rx="8"/>
    <text class="name" x="526" y="358">Levels · EQ</text>
    <text class="sub" x="526" y="377">gate cuts background noise,</text>
    <text class="sub" x="526" y="393">limiter stops clipping</text>

    <!-- virtual mic -->
    <rect class="virt" x="268" y="344" width="180" height="54" rx="8"/>
    <text class="name" x="284" y="367">system-out</text>
    <text class="sub" x="284" y="385">the default microphone</text>

    <!-- programs -->
    <rect class="box" x="40" y="344" width="170" height="54" rx="8"/>
    <text class="name" x="56" y="367">Discord, OBS…</text>
    <text class="sub" x="56" y="385">record from here</text>

    <path class="w" d="M 972 340 C 940 340, 944 366, 918 366"/>
    <path class="w off" d="M 972 398 C 944 398, 940 386, 918 386"/>
    <path class="w" d="M 738 371 L 684 371"/>
    <path class="w" d="M 510 371 L 452 371"/>
    <path class="w" d="M 268 371 L 214 371"/>

    <!-- Footnote -->
    <text class="sub" x="40" y="450" font-size="12.5">Programs only ever see the green virtual devices. Switching hardware changes the last hop, so no program has to be restarted or reconfigured.</text>
  </g>
</svg>
